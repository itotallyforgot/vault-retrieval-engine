# OSSF Scorecard — standalone workflow for this public repo.
#
# Copied from the central paved-path template (itotallyforgot/.github
# templates/scorecard.yml@v1). Scorecard needs repository-level permissions
# that a reusable workflow cannot cleanly inherit, so it lives here as a
# standalone scheduled workflow rather than a workflow_call.
#
# Third-party actions are pinned to a full commit SHA with a trailing version
# comment, matching the fleet standard.

name: scorecard

on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: scorecard-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the public scorecard API
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
