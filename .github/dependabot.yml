version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # uv-managed project: the "uv" ecosystem updates pyproject.toml AND uv.lock
  # together. The "pip" ecosystem only widens pyproject.toml constraints, which
  # leaves uv.lock stale and makes `uv sync --locked` fail in CI.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
